[package]
name = "matrix-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"] }
libc = "0.2"
toml = "0.8"
dotenvy = "0.15"
rand = "0.8"
unicode-width = "0.2"
futures-util = "0.3"
anyhow = "1"
dirs = "5"
